---
name: ci-main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.169.0"
  TZ: Europe/Paris

defaults:
  run:
    shell: bash

jobs:
  build-website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: checkout@scm
        uses: actions/checkout@v7

      - name: configure@pages
        id: pages
        uses: actions/configure-pages@v6

      - name: setup@buildchain
        run: |
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: build@website
        env:
          HUGO_ENVIRONMENT: production
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --baseURL "${PAGES_BASE_URL}/"

      - name: upload@artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy-website:
    if: github.ref == 'refs/heads/main'
    needs: build-website
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy@pages
        id: deployment
        uses: actions/deploy-pages@v5
