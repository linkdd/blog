{{ define "title" }}
  {{ .Site.Title }} | {{ .Title }}
{{ end }}

{{ define "css" }}
  <link rel="stylesheet" href="{{ "css/post.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/post-print.css" | relURL }}" media="print">
{{ end }}

{{ define "main" }}
  <div class="content">
    <h1>{{ .Title }}</h1>

    <hr>

    {{ .Content }}
  </div>
{{ end }}
